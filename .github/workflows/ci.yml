name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        if: matrix.node-version == '22'

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ is out of date
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ is out of date. Run 'npm run build' and commit the result." >&2
            git diff -- dist
            exit 1
          fi

  e2e:
    needs: build-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NODE_ENV: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Build fixture file URLs
        id: fixtures
        run: |
          node -e "const {pathToFileURL} = require('node:url'); for (const name of ['passing', 'failing']) console.log(name + '=' + pathToFileURL('test/fixtures/' + name + '.html').href)" >> "$GITHUB_OUTPUT"
      - id: passing
        uses: $/
        with:
          urls: ${{ steps.fixtures.outputs.passing }}
      - name: Assert the passing fixture reported zero issues
        env:
          TOTAL_ISSUES: ${{ steps.passing.outputs.total-issues }}
        run: |
          if [ "$TOTAL_ISSUES" != "0" ]; then
            echo "expected 0 issues, got '$TOTAL_ISSUES'" >&2
            exit 1
          fi
      - id: failing
        continue-on-error: true
        uses: $/
        with:
          urls: ${{ steps.fixtures.outputs.failing }}
          # Covers the cache-off path; the passing step above covers cache-on.
          cache: 'false'
      - name: Assert the failing fixture failed the action
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          TOTAL_ISSUES: ${{ steps.failing.outputs.total-issues }}
        run: |
          if [ "$OUTCOME" != "failure" ] || [ -z "$TOTAL_ISSUES" ] || [ "$TOTAL_ISSUES" == "0" ]; then
            echo "expected the failing fixture to fail with issues, got outcome '$OUTCOME' and '$TOTAL_ISSUES' issues" >&2
            exit 1
          fi
      - name: Serve fixtures for the sitemap test
        if: runner.os == 'Linux'
        run: python3 -m http.server 8080 --directory test/fixtures &
      - id: sitemap
        if: runner.os == 'Linux'
        uses: $/
        with:
          sitemap: http://127.0.0.1:8080/sitemap.xml
      - name: Assert the sitemap URLs were tested
        if: runner.os == 'Linux'
        env:
          TOTAL_URLS: ${{ steps.sitemap.outputs.total-urls }}
        run: |
          if [ "$TOTAL_URLS" != "1" ]; then
            echo "expected 1 URL from the sitemap, got '$TOTAL_URLS'" >&2
            exit 1
          fi

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail the job on findings instead of uploading SARIF to code scanning.
          advanced-security: false

  are-we-good:
    runs-on: ubuntu-slim
    needs: [test, build-check, e2e, zizmor]
    if: always()
    steps:
      - uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
